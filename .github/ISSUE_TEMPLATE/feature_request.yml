name: Feature request
description: Suggest an idea for mdesume
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds?
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This feature keeps the app statically exportable (no server/DB/auth).
          required: true
