name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine base path and canonical URL
        # A CNAME means the site is served from a custom domain at the root.
        # Otherwise this is a project page served from /<repo>.
        run: |
          if [ -f "public/CNAME" ]; then
            BASE_PATH=""
            SITE_URL="https://$(tr -d '[:space:]' < public/CNAME)"
            echo "Custom domain detected — basePath: (root), site: ${SITE_URL}"
          else
            BASE_PATH="/${GITHUB_REPOSITORY#*/}"
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            echo "Project page deploy — basePath: ${BASE_PATH}, site: ${SITE_URL}"
          fi
          echo "PUBLIC_BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"
          echo "PUBLIC_SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"

      - name: Build static site
        run: bun run build

      - name: Ensure .nojekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
